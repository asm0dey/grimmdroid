# Tool versions for local dev and CI (jdx/mise-action). Renovate bumps these.
# Java lives in .sdkmanrc so sdkman users (sdkman_auto_env) and mise read one pin; bump it by hand,
# Renovate has no sdkman manager. Gradle is not here: ./gradlew pins it.
# android-sdk (cmdline-tools only) is for local dev: it exports ANDROID_HOME, so no local.properties
# sdk.dir is needed. CI keeps the runner's preinstalled SDK: ci.yml's install_args names only the
# tools it wants and its `mise run` step passes --skip-tools (otherwise mise auto-installs every
# tool here), so android-sdk is never installed there and mise exports nothing for it.
[settings]
idiomatic_version_file_enable_tools = ["java"]

[tools]
ruby = "4.0.7"
actionlint = "1.7.12"
android-sdk = "23.0"

[env]
# The one list of SDK packages `mise run setup` installs: compileSdk 37 (app/build.gradle.kts) and
# AGP 9.4.1's default build-tools (ToolsRevisionUtils.DEFAULT_BUILD_TOOLS_REVISION). Bump with AGP.
ANDROID_SDK_PACKAGES = "platforms/android-37.0 build-tools/36.0.0 platform-tools"

# Thin wrappers: the commands themselves live in Gradle / fastlane.
[tasks.setup]
description = "Install gems and Android SDK packages (local dev only, not CI)"
run = [
  "bundle install",
  "android sdk install $ANDROID_SDK_PACKAGES",
]

[tasks.test]
description = "Unit tests via fastlane"
run = "bundle exec fastlane test"

[tasks.check]
description = "Full gate: formatting, lint, unit tests"
run = "./gradlew spotlessCheck lint testDebugUnitTest"

[tasks.format]
description = "Apply formatting and license headers"
run = "./gradlew spotlessApply"

[tasks.build]
description = "Assemble the debug APK"
run = "./gradlew assembleDebug"

[tasks.lint-ci]
description = "Lint GitHub Actions workflows"
run = "actionlint"
