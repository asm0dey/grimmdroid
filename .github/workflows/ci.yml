name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes older runs; tags are their own ref, so a release run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up tools from mise.toml
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: "java ruby"
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Ruby gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock') }}
      - run: |
          bundle config set path vendor/bundle
          bundle install
      - run: bundle exec fastlane test

  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: "actionlint"
      # --skip-tools: otherwise mise installs every tool in mise.toml, android-sdk included.
      - run: mise run --skip-tools lint-ci

  # A tag push publishes the signed APK, AAB and APK set as a GitHub release, once the test gate passes.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRIMMDROID_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      GRIMMDROID_KEY_ALIAS: ${{ secrets.ALIAS }}
      GRIMMDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: "java ruby"
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Ruby gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock') }}
      - run: |
          bundle config set path vendor/bundle
          bundle install
      - name: Decode keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "GRIMMDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: bundle exec fastlane release
      # Release assets are named grimmdroid-<tag>.<ext>; Gradle's outputs keep their default names.
      - name: Name release assets
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/grimmdroid-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/grimmdroid-$GITHUB_REF_NAME.aab"
          cp app/build/outputs/apks/release/app-release.apks "dist/grimmdroid-$GITHUB_REF_NAME.apks"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
