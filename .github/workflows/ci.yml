name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: "java ruby"
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Ruby gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock') }}
      - run: |
          bundle config set path vendor/bundle
          bundle install
      - run: bundle exec fastlane test

  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: "actionlint"
      # --skip-tools: otherwise mise installs every tool in mise.toml, android-sdk included.
      - run: mise run --skip-tools lint-ci

  # A tag push publishes the signed APK as a GitHub release, once the test gate passes.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRIMMDROID_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      GRIMMDROID_KEY_ALIAS: ${{ secrets.ALIAS }}
      GRIMMDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: "java ruby"
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Ruby gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: gems-${{ hashFiles('Gemfile.lock') }}
      - run: |
          bundle config set path vendor/bundle
          bundle install
      - name: Decode keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "GRIMMDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: bundle exec fastlane release
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
