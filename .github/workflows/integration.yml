name: Integration

# Not a merge gate: pulls the Grimmory image and runs LiveServerTest against it.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes older runs; tags are their own ref, so a release run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java from .sdkmanrc
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: "java"
      - uses: gradle/actions/setup-gradle@v6
      - name: Start Grimmory
        run: docker compose -f integration/docker-compose.yml up -d --wait
      - run: ./gradlew integrationTest
      - name: Server logs
        if: failure()
        run: docker compose -f integration/docker-compose.yml logs grimmory
      - name: Stop Grimmory
        if: always()
        run: docker compose -f integration/docker-compose.yml down -v
