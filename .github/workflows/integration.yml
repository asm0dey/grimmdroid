name: Integration

# Not a merge gate: pulls the Grimmory image and runs LiveServerTest against it.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java from .sdkmanrc
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: "java"
      - uses: gradle/actions/setup-gradle@v6
      - name: Start Grimmory
        run: docker compose -f integration/docker-compose.yml up -d --wait
      - run: ./gradlew integrationTest
      - name: Server logs
        if: failure()
        run: docker compose -f integration/docker-compose.yml logs grimmory
      - name: Stop Grimmory
        if: always()
        run: docker compose -f integration/docker-compose.yml down -v
